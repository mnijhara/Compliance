name: ComplyOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/complyos-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          health_file=/tmp/complyos-health.json
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > "$health_file"; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/complyos-server.log
              exit 1
            fi
            sleep 1
          done

          test -s "$health_file"
          node -e "const fs=require('fs'); const body=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if(body.status !== 'ok') throw new Error('Unexpected health status: '+body.status); if(body.complianceEngine !== 'evidence-first') throw new Error('Evidence-first engine not reported'); if(typeof body.productionReadyForSystemOfRecord !== 'boolean') throw new Error('Missing production readiness signal');" "$health_file"
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/complyos-home.html
          grep -q '<!doctype html' /tmp/complyos-home.html
          cat /tmp/complyos-server.log
