name: ComplyOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
