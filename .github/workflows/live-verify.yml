name: ComplyOS Live Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for public deployment
        env:
          LIVE_BASE_URL: https://complyos.online
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if LIVE_BASE_URL="$LIVE_BASE_URL" npm run test:live; then
              exit 0
            fi
            echo "Live site not ready yet; retrying in 20s (attempt $attempt/30)"
            sleep 20
          done
          echo "Public deployment did not pass Chromium verification within 10 minutes"
          exit 1
