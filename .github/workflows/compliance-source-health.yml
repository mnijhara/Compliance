name: Compliance Source Health

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm install
      - name: Validate source registry
        run: npm run test:compliance-sources
      - name: Probe authoritative sources
        run: node scripts/check-compliance-source-health.mjs
        env:
          MAX_SOURCE_AGE_DAYS: 30
          SOURCE_TIMEOUT_MS: 10000
          SOURCE_PROBE_RETRIES: 2
          STRICT_SOURCE_REACHABILITY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-source-health
          path: compliance-source-health.json
          if-no-files-found: ignore
